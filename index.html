  <style>
    :root { color-scheme: light dark; --bg:#f7faf7; --panel:#ffffff; --ink:#17231b; --muted:#5b6860; --line:#d5dfd6; --brand:#1f6b3a; --soft:#eaf4ec; --warn:#7a4d00; }
    @media (prefers-color-scheme: dark) { :root { --bg:#111812; --panel:#172019; --ink:#eaf2eb; --muted:#b2c2b5; --line:#344839; --brand:#79d090; --soft:#203b28; --warn:#f4c66d; } }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
    header { padding:28px max(20px, calc((100% - 1500px)/2)); background:linear-gradient(120deg,#173f25,var(--brand)); color:#fff; }
    h1 { margin:0 0 6px; font-size:28px; } header p { margin:0; opacity:.9; }
    main { max-width:1500px; margin:0 auto; padding:20px; }
    .filters { display:grid; grid-template-columns:2fr repeat(4,minmax(125px,1fr)); gap:12px; padding:16px; background:var(--panel); border:1px solid var(--line); border-radius:12px; }
    label { display:grid; gap:5px; color:var(--muted); font-size:12px; } input,select,button { font:inherit; } input,select { min-width:0; padding:9px 10px; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--ink); }
    .check { display:flex; align-items:center; gap:7px; padding-top:20px; font-size:13px; color:var(--ink); } .check input { width:16px; height:16px; }
    button { align-self:end; padding:9px 14px; border:1px solid var(--brand); border-radius:7px; color:var(--brand); background:transparent; cursor:pointer; } button:hover { background:var(--soft); }
    .summary { display:flex; justify-content:space-between; gap:16px; align-items:center; margin:18px 0 10px; color:var(--muted); } .summary strong { color:var(--ink); }
    .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:12px; background:var(--panel); }
    table { width:100%; border-collapse:collapse; min-width:1120px; } th,td { padding:10px 11px; border-bottom:1px solid var(--line); border-right:1px solid var(--line); vertical-align:middle; text-align:left; } th:last-child,td:last-child { border-right:0; } th { position:sticky; top:0; background:var(--soft); color:var(--ink); font-weight:650; white-space:nowrap; text-align:center; } tbody tr:hover { background:var(--soft); } th.num,td.num { text-align:center; font-variant-numeric:tabular-nums; white-space:nowrap; } th.center,td.center { text-align:center; white-space:nowrap; } td.model { font-weight:650; min-width:190px; } td.note { min-width:220px; } td.source { text-align:center; white-space:nowrap; } a { color:var(--brand); } .tag { display:inline-block; margin-top:4px; padding:1px 6px; background:var(--soft); color:var(--brand); border-radius:999px; font-size:11px; }
    .empty { padding:44px; text-align:center; color:var(--muted); }
    @media (max-width:900px) { .filters { grid-template-columns:repeat(2,minmax(0,1fr)); } .filters label:first-child { grid-column:1/-1; } h1 { font-size:23px; } }
    @media (max-width:520px) { main { padding:12px; } header { padding:22px 16px; } .filters { grid-template-columns:1fr; } .filters label:first-child { grid-column:auto; } .check { padding-top:0; } }
  </style>
</head>
<body>
  <header><h1>Nvidia GPU筛选器</h1><p>数据中心、专业工作站与指定 4090/4090D/5090/5090D；系统级与单 GPU 口径已区分。</p></header>
  <main>
    <section class="filters" aria-label="筛选条件">
      <label>关键词搜索<input id="query" type="search" placeholder="型号、架构、形态、备注…"></label>
      <label>架构<select id="architecture"><option value="">全部架构</option></select></label>
      <label>形态<select id="form"><option value="">全部形态</option></select></label>
      <label>部署场景<select id="deployment"><option value="">全部场景</option></select></label>
      <label>最低显存 (GB)<select id="memory"><option value="0">不限</option><option value="8">8+</option><option value="16">16+</option><option value="20">20+</option><option value="24">24+</option><option value="32">32+</option><option value="48">48+</option><option value="64">64+</option><option value="80">80+</option><option value="96">96+</option><option value="141">141+</option><option value="192">192+</option><option value="288">288+</option></select></label>
      <label>最高功耗 (W)<select id="power"><option value="">不限</option><option value="70">70 以下</option><option value="75">75 以下</option><option value="100">100 以下</option><option value="150">150 以下</option><option value="200">200 以下</option><option value="250">250 以下</option><option value="300">300 以下</option><option value="400">400 以下</option><option value="700">700 以下</option><option value="1000">1,000 以下</option><option value="1500">1,500 以下</option></select></label>
      <label>排序<select id="sort"><option value="name">型号</option><option value="memoryDesc">显存（高到低）</option><option value="memoryAsc">显存（低到高）</option><option value="bandwidthDesc">带宽（高到低）</option><option value="powerAsc">功耗（低到高）</option><option value="powerDesc">功耗（高到低）</option><option value="fp32Desc">FP32（高到低）</option><option value="tensorDesc">Tensor（高到低）</option></select></label>
      <label class="check"><input id="excludeConsumer" type="checkbox" checked>隐藏指定消费级卡</label>
      <label class="check"><input id="hideUnknown" type="checkbox">隐藏关键参数缺失条目</label>
      <button id="reset" type="button">重置筛选</button>
    </section>
    <div class="summary"><span id="count"></span><span>显存按“单颗 GPU 容量”筛选（多 GPU 板卡取单颗口径）；“—”表示无同口径数据，无数据条目在排序中恒排末尾。</span></div>
    <div class="table-wrap"><table><thead><tr><th>产品 / 模组</th><th>架构</th><th>形态</th><th class="center">GPU 数</th><th>显存配置</th><th class="num">带宽</th><th class="num">最大功耗</th><th class="num">FP32</th><th>Tensor</th><th>适用部署</th><th>关键说明</th><th class="center">来源</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>没有匹配项，请放宽筛选条件。</div></div>

  <script>
    const data = window.GPU_DATA || [];
    const $ = (id) => document.getElementById(id);
    const fields = ["query","architecture","form","deployment","memory","power","sort","excludeConsumer","hideUnknown"];
    // 先剔除千分位逗号再取最大数值；"未公布"/"—" 等无数据返回 -1
    const num = (text) => { const s = String(text).replace(/,(?=\d{3}\b)/g, ""); const matches = s.match(/\d+(?:\.\d+)?/g); return matches ? Math.max(...matches.map(Number)) : -1; };
    // 显存按“单颗 GPU 可寻址容量”口径：多 GPU 板卡/整模组取单颗容量
    // 支持 "2×288GB HBM3e"、"4x 16 GB GDDR6"、"32GB GDDR5（4×8GB）" 三种写法
    const memPerGpu = (text) => {
      const s = String(text).replace(/,(?=\d{3}\b)/g, "");
      const multi = s.match(/(\d+)\s*[×x]\s*(\d+(?:\.\d+)?)\s*GB/i);
      if (multi) return Number(multi[2]); // N×M GB → 每颗 GPU 为 M GB
      return num(s);
    };
    const hasValue = (v) => { const s = String(v).trim(); return s && s !== "—" && s !== "-" && !/^—|^未公布|^系统级|^服务器 SKU|^依平台/.test(s); };
    const consumer = (row) => String(row["产品 / 模组"]).includes("GeForce");
    const addOptions = (id, key) => [...new Set(data.map(x => x[key]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"zh-CN")).forEach(v => { const o=document.createElement("option"); o.value=v; o.textContent=v; $(id).append(o); });
    addOptions("architecture","架构"); addOptions("form","形态"); addOptions("deployment","适用部署");
    function render() {
      const q = $("query").value.trim().toLowerCase(), arch=$("architecture").value, form=$("form").value, dep=$("deployment").value;
      const minMem=Number($("memory").value), maxPower=$("power").value ? Number($("power").value) : Infinity;
      const hideConsumer=$("excludeConsumer").checked, hideUnknown=$("hideUnknown").checked;
      let rows = data.filter(r => {
        const hay=Object.values(r).join(" ").toLowerCase();
        const mem=memPerGpu(r["显存配置"]), pw=num(r["最大功耗 (W)"]);
        const okMem = minMem===0 || (mem>=0 && mem>=minMem);
        const okPower = maxPower===Infinity || (pw>=0 && pw<=maxPower);
        const okKnown = !hideUnknown || (hasValue(r["带宽 (GB/s)"]) && hasValue(r["最大功耗 (W)"]) && hasValue(r["FP32 (TFLOPS)"]));
        return (!q || hay.includes(q)) && (!arch || r["架构"]===arch) && (!form || r["形态"]===form) && (!dep || r["适用部署"]===dep) && okMem && okPower && okKnown && (!hideConsumer || !consumer(r));
      });
      const sort=$("sort").value;
      // 无数据的条目恒排在末尾，不参与数值比较
      const desc=(key,fn)=>(a,b)=>{ const x=fn(a[key]), y=fn(b[key]); if(x<0&&y<0) return 0; if(x<0) return 1; if(y<0) return -1; return y-x; };
      const asc=(key,fn)=>(a,b)=>{ const x=fn(a[key]), y=fn(b[key]); if(x<0&&y<0) return 0; if(x<0) return 1; if(y<0) return -1; return x-y; };
      rows.sort((a,b) => sort==="memoryDesc" ? desc("显存配置",memPerGpu)(a,b)
        : sort==="memoryAsc" ? asc("显存配置",memPerGpu)(a,b)
        : sort==="bandwidthDesc" ? desc("带宽 (GB/s)",num)(a,b)
        : sort==="powerAsc" ? asc("最大功耗 (W)",num)(a,b)
        : sort==="powerDesc" ? desc("最大功耗 (W)",num)(a,b)
        : sort==="fp32Desc" ? desc("FP32 (TFLOPS)",num)(a,b)
        : sort==="tensorDesc" ? desc("BF16/FP16 Tensor (TFLOPS)",num)(a,b)
        : String(a["产品 / 模组"]).localeCompare(String(b["产品 / 模组"]),"zh-CN"));
      $("count").innerHTML=`找到 <strong>${rows.length}</strong> / ${data.length} 个条目`;
      $("rows").innerHTML=rows.map(r=>`<tr><td class="model">${r["产品 / 模组"]}${consumer(r)?'<span class="tag">指定消费级</span>':''}</td><td>${r["架构"]}</td><td>${r["形态"]}</td><td class="center">${r["GPU 数"]}</td><td>${r["显存配置"]}</td><td class="num">${r["带宽 (GB/s)"]}</td><td class="num">${r["最大功耗 (W)"]}</td><td class="num">${r["FP32 (TFLOPS)"]}</td><td>${r["BF16/FP16 Tensor (TFLOPS)"]}</td><td>${r["适用部署"]}</td><td class="note">${r["关键说明"]}</td><td class="source">${String(r["官方来源"]).split("|").map(u=>u.trim()).filter(Boolean).map((u,i)=>`<a href="${u}" target="_blank" rel="noreferrer">来源${String(r["官方来源"]).split("|").filter(x=>x.trim()).length>1?i+1:""}</a>`).join(" ")}</td></tr>`).join("");
      $("empty").hidden=rows.length!==0;
    }
    fields.forEach(id=>$(id).addEventListener(id==="query"?"input":"change",render));
    $("reset").addEventListener("click",()=>{ $("query").value=""; $("architecture").value=""; $("form").value=""; $("deployment").value=""; $("memory").value="0"; $("power").value=""; $("sort").value="name"; $("excludeConsumer").checked=true; $("hideUnknown").checked=false; render(); });
    render();
  </script>
